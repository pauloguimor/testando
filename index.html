<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resultados do Concurso Público</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">

<style>
body {
    background-color: #f8f9fa;
    padding-top: 20px;
    padding-bottom: 40px;
}
.header {
    background: linear-gradient(135deg, #2c3e50, #4a6491);
    color: white;
    padding: 30px 0;
    margin-bottom: 30px;
    border-radius: 10px;
}
.stat-card {
    background: white;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
    border-left: 4px solid #4a6491;
}
.filter-section {
    background: white;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
}
.badge-aprovado { background-color: #28a745; }
.badge-pcd { background-color: #17a2b8; }
.loading { text-align: center; padding: 40px; display: none; }
</style>
</head>

<body>
<div class="container">

<div class="header text-center">
<h1>📊 Resultados do Concurso Público</h1>
<p class="lead">Consulta de candidatos aprovados</p>
</div>

<!-- FILTROS -->
<div class="filter-section">
<div class="row">
<div class="col-md-4">
<label>SRE</label>
<select id="filterSRE" class="form-select">
<option value="">Todas</option>
</select>
</div>

<div class="col-md-4">
<label>Cargo</label>
<select id="filterCargo" class="form-select">
<option value="">Todos</option>
</select>
</div>

<div class="col-md-4">
<label>Situação</label>
<select id="filterSituacao" class="form-select">
<option value="">Todas</option>
<option value="Aprovado">Aprovado</option>
<option value="Aprovado PcD">Aprovado PcD</option>
</select>
</div>
</div>

<div class="row mt-3">
<div class="col-md-8">
<input type="text" id="searchNome" class="form-control" placeholder="Buscar por nome">
</div>
<div class="col-md-4">
<button id="btnVerResultados" class="btn btn-primary w-100">
🔍 Ver resultados
</button>
</div>
</div>
</div>

<!-- LOADING -->
<div id="loading" class="loading">
<div class="spinner-border text-primary"></div>
<p>Carregando dados...</p>
</div>

<!-- ESTATÍSTICAS -->
<div id="stats" class="row" style="display:none">
<div class="col-md-3"><div class="stat-card"><h5>Total</h5><h2 id="total"></h2></div></div>
<div class="col-md-3"><div class="stat-card"><h5>Ampla</h5><h2 id="ampla"></h2></div></div>
<div class="col-md-3"><div class="stat-card"><h5>PcD</h5><h2 id="pcd"></h2></div></div>
<div class="col-md-3"><div class="stat-card"><h5>SREs</h5><h2 id="sres"></h2></div></div>
</div>

<!-- TABELA -->
<div class="table-responsive mt-4" style="display:none" id="tabelaBox">
<table id="resultadosTable" class="table table-striped">
<thead>
<tr>
<th>Ordem</th>
<th>Nome</th>
<th>Total</th>
<th>SRE</th>
<th>Cargo</th>
<th>Situação</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

<script>
let carregado = false;
let dadosGlobais = [];
let tabela;

function parseCSV(csv){
const linhas = csv.split('\n');
const cab = linhas[0].split(';');
return linhas.slice(1).filter(l=>l.trim()).map(l=>{
const obj={};
l.split(';').forEach((v,i)=>obj[cab[i]]=v.trim());
return obj;
});
}

function atualizarStats(d){
$('#total').text(d.length);
$('#ampla').text(d.filter(x=>x.SITUACAO==="Aprovado").length);
$('#pcd').text(d.filter(x=>x.SITUACAO==="Aprovado PcD").length);
$('#sres').text(new Set(d.map(x=>x.SRE)).size);
$('#stats').show();
}

function popularFiltros(d){
[...new Set(d.map(x=>x.SRE))].sort().forEach(v=>{
$('#filterSRE').append(`<option>${v}</option>`);
});
[...new Set(d.map(x=>x.CARGO))].sort().forEach(v=>{
$('#filterCargo').append(`<option>${v}</option>`);
});
}

function iniciarTabela(d){
tabela = $('#resultadosTable').DataTable({
data:d,
columns:[
{data:'ORDEM'},
{data:'NOME'},
{data:'TOTAL'},
{data:'SRE'},
{data:'CARGO'},
{data:'SITUACAO'}
],
pageLength:25,
language:{url:'//cdn.datatables.net/plug-ins/1.13.6/i18n/pt-BR.json'}
});

$('#filterSRE').on('change',()=>tabela.column(3).search($('#filterSRE').val()).draw());
$('#filterCargo').on('change',()=>tabela.column(4).search($('#filterCargo').val()).draw());
$('#filterSituacao').on('change',()=>tabela.column(5).search($('#filterSituacao').val()).draw());
$('#searchNome').on('keyup',()=>tabela.column(1).search($('#searchNome').val()).draw());

$('#tabelaBox').show();
}

$('#btnVerResultados').on('click', async ()=>{
if(carregado) return;

$('#loading').show();

const r = await fetch('dados.csv');
const csv = await r.text();
dadosGlobais = parseCSV(csv);

popularFiltros(dadosGlobais);
atualizarStats(dadosGlobais);
iniciarTabela(dadosGlobais);

$('#loading').hide();
carregado = true;
});
</script>

</body>
</html>
